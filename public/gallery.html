<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儿童画展 - 抠图效果预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0f0f2e 100%);
      min-height: 100vh;
      font-family: 'Nunito', -apple-system, sans-serif;
      color: #e0e0e0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 40px;
      color: #f0d78c;
      text-shadow: 0 0 20px rgba(240, 215, 140, 0.3);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      display: block;
      border-radius: 8px;
      background: repeating-conic-gradient(#1a1a2e 0% 25%, #16162a 0% 50%) 50% / 20px 20px;
    }

    .card .label {
      text-align: center;
      margin-top: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #c0c0d0;
    }

    .toggle-bg {
      text-align: center;
      margin-bottom: 30px;
    }

    .toggle-bg button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #e0e0e0;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin: 0 8px;
      transition: all 0.2s;
    }

    .toggle-bg button:hover {
      background: rgba(255,255,255,0.2);
    }

    .toggle-bg button.active {
      background: rgba(240, 215, 140, 0.25);
      border-color: #f0d78c;
      color: #f0d78c;
    }
  </style>
</head>
<body>
  <h1>儿童画展 - 抠图效果预览</h1>

  <div class="toggle-bg">
    <button class="active" onclick="setBg('dark')">深色背景</button>
    <button onclick="setBg('light')">浅色背景</button>
    <button onclick="setBg('checkered')">棋盘格</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="card">
      <img src="assets/transparent/%E4%B9%8C%E9%9A%BC.png" alt="乌隼">
      <div class="label">乌隼</div>
    </div>
    <div class="card">
      <img src="assets/transparent/%E5%A4%A7%E6%A0%91.png" alt="大树">
      <div class="label">大树</div>
    </div>
    <div class="card">
      <img src="assets/transparent/%E9%B8%9F%E5%B7%A2.png" alt="鸟巢">
      <div class="label">鸟巢</div>
    </div>
    <div class="card">
      <img src="assets/transparent/%E9%A3%8E.png" alt="风">
      <div class="label">风</div>
    </div>
    <div class="card">
      <img src="assets/transparent/%E6%9C%88%E4%BA%AE.png" alt="月亮">
      <div class="label">月亮</div>
    </div>
    <div class="card">
      <img src="assets/transparent/%E7%A9%BA%E6%B0%94.png" alt="空气">
      <div class="label">空气</div>
    </div>
    <div class="card">
      <img src="assets/transparent/%E5%8F%98%E8%89%B2%E9%BE%99.png" alt="变色龙">
      <div class="label">变色龙</div>
    </div>
  </div>

  <script>
    const bgs = {
      dark: 'repeating-conic-gradient(#1a1a2e 0% 25%, #16162a 0% 50%) 50% / 20px 20px',
      light: '#f5f5f5',
      checkered: 'repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 20px 20px'
    };

    function setBg(type) {
      document.querySelectorAll('.toggle-bg button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.card img').forEach(img => {
        img.style.background = bgs[type];
      });
    }
  </script>
</body>
</html>
