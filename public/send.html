<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>发送弹幕 - 小1的儿童展</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(160deg, #0a0a1a 0%, #12102a 30%, #1a1040 60%, #0f0f2a 100%);
      font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card h1 {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: 34px;
      background: linear-gradient(135deg, #FF7B7B, #FFD93D 60%, #FFB347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 20px rgba(255,123,123,0.25));
    }
    .card .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.50);
      font-weight: 600;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #danmaku-input {
      width: 100%;
      padding: 15px 18px;
      font-size: 17px;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      outline: none;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      background: rgba(255,255,255,0.08);
      color: #fff;
      -webkit-appearance: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    #danmaku-input::placeholder {
      color: rgba(255,255,255,0.30);
      font-weight: 400;
    }
    #danmaku-input:focus {
      border-color: rgba(255,123,123,0.5);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 4px rgba(255,123,123,0.12);
    }

    #send-btn {
      width: 100%;
      padding: 15px;
      font-size: 19px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #FF7B7B, #FF8E73);
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      -webkit-appearance: none;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(255,123,123,0.3);
    }
    #send-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      font-weight: 600;
      margin-top: 2px;
    }

    #toast {
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      display: none;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .connection-status {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.40);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.connected {
      background: #4ECDC4;
      box-shadow: 0 0 8px rgba(78,205,196,0.5);
      animation: pulse 1.5s infinite;
    }
    .status-dot.disconnected {
      background: #E17055;
      box-shadow: 0 0 8px rgba(225,112,85,0.4);
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>小1的儿童展</h1>
    <p class="subtitle">发送弹幕，出现在大屏幕上</p>

    <div class="input-group">
      <input id="danmaku-input" type="text" maxlength="100"
             placeholder="输入弹幕内容..." autofocus>
      <span class="char-count" id="char-count">0/100</span>
      <button id="send-btn">发 送</button>
    </div>

    <div id="toast"></div>
    <div class="connection-status">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">连接中...</span>
    </div>
  </div>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    let reconnectTimer = null;

    function connect() {
      if (ws) {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
      }
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('status-dot').className = 'status-dot connected';
        document.getElementById('status-text').textContent = '已连接';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'new_danmaku') {
          showToast('发送成功', '#4ECDC4');
        } else if (msg.type === 'rejected') {
          showToast(msg.message, '#E17055');
        } else if (msg.type === 'error') {
          showToast(msg.message, '#FF8E53');
        }
      };

      ws.onclose = () => {
        document.getElementById('status-dot').className = 'status-dot disconnected';
        document.getElementById('status-text').textContent = '连接断开，3秒后重连...';
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    const input = document.getElementById('danmaku-input');
    const sendBtn = document.getElementById('send-btn');
    const charCount = document.getElementById('char-count');
    const toast = document.getElementById('toast');

    let toastTimer;
    function showToast(msg, bg = '#E17055') {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.background = bg;
      toast.style.color = '#fff';
      toast.style.display = 'block';
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    input.addEventListener('input', () => {
      charCount.textContent = `${input.value.length}/100`;
    });

    function sendDanmaku() {
      const text = input.value.trim();
      if (!text) return showToast('请输入弹幕内容', '#FF8E53');
      if (text.length > 100) return showToast('内容不能超过100字', '#FF8E53');

      if (ws.readyState !== WebSocket.OPEN) {
        return showToast('连接已断开，请稍候重试', '#E17055');
      }

      ws.send(JSON.stringify({ type: 'danmaku', text }));
      input.value = '';
      charCount.textContent = '0/100';
      showToast('审核中...', '#45B7D1');
    }

    sendBtn.addEventListener('click', sendDanmaku);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendDanmaku();
      }
    });

    connect();
  </script>
</body>
</html>
