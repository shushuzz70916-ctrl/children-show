<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>发送弹幕 - iSTART儿童艺术展-11：07PM</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #FF71CE;
      --yellow: #FFCE5C;
      --teal: #86CCCA;
      --purple: #8B6BAE;
      --coral: #FF6B6B;
      --mint: #7ECB9A;
      --lavender: #B8A9E8;
      --bg-deep: #1a1040;
      --border-width: 3px;
      --shadow-offset: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle, #fff 1px, transparent 1px),
        linear-gradient(150deg, #1a1040 0%, #1e1650 35%, #1a1040 65%, #150d35 100%);
      background-size: 24px 24px, 100% 100%;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ========== 装饰几何元素 ========== */
    body::before {
      content: '';
      position: fixed;
      top: 5%;
      right: 5%;
      width: 50px;
      height: 50px;
      background: var(--teal);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: 10%;
      left: 7%;
      width: 40px;
      height: 40px;
      background: var(--pink);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(26, 16, 64, 0.92);
      border: var(--border-width) solid rgba(255,255,255,0.85);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow:
        var(--shadow-offset) var(--shadow-offset) 0 var(--purple),
        0 0 40px rgba(139,107,174,0.25);
      text-align: center;
    }

    .card h1 {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: 32px;
      background: linear-gradient(135deg, var(--pink), var(--yellow) 50%, var(--teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      filter: drop-shadow(2px 2px 0 var(--purple));
    }
    .card .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 0.03em;
      font-family: 'Fredoka', 'Nunito', 'PingFang SC', sans-serif;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #danmaku-input {
      width: 100%;
      padding: 15px 18px;
      font-size: 17px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      outline: none;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
      color: #fff;
      -webkit-appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    #danmaku-input::placeholder {
      color: rgba(255,255,255,0.3);
      font-weight: 400;
    }
    #danmaku-input:focus {
      border-color: var(--pink);
      background: rgba(255,255,255,0.16);
      box-shadow: 0 0 0 4px rgba(255,113,206,0.2);
    }

    #send-btn {
      width: 100%;
      padding: 15px;
      font-size: 19px;
      border: var(--border-width) solid rgba(255,255,255,0.9);
      border-radius: 14px;
      background: var(--pink);
      color: #fff;
      cursor: pointer;
      font-family: 'Fredoka', 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      -webkit-appearance: none;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 4px 4px 0 var(--yellow);
    }
    #send-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--yellow);
      background: #FF8BD8;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      font-weight: 600;
      margin-top: 2px;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
    }

    #toast {
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 700;
      display: none;
      text-align: center;
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
    }

    .connection-status {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      border: 1.5px solid rgba(255,255,255,0.6);
    }
    .status-dot.connected {
      background: var(--mint);
      box-shadow: 0 0 10px rgba(126,203,154,0.5);
      animation: pulse 1.5s infinite;
    }
    .status-dot.disconnected {
      background: var(--coral);
      box-shadow: 0 0 10px rgba(255,107,107,0.4);
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ========== 底部波浪装饰 ========== */
    .squiggle-bottom {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 24px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>iSTART儿童艺术展-11：07PM</h1>
    <p class="subtitle">发送弹幕，出现在大屏幕上</p>

    <div class="input-group">
      <input id="danmaku-input" type="text" maxlength="100"
             placeholder="输入弹幕内容..." autofocus>
      <span class="char-count" id="char-count">0/100</span>
      <button id="send-btn">发 送</button>
    </div>

    <div id="toast"></div>
    <div class="connection-status">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">连接中...</span>
    </div>
  </div>

  <svg class="squiggle-bottom" viewBox="0 0 200 24" fill="none">
    <path d="M0,12 Q20,2 40,12 Q60,22 80,12 Q100,2 120,12 Q140,22 160,12 Q180,2 200,12"
          stroke="#FFCE5C" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    let reconnectTimer = null;

    function connect() {
      if (ws) {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
      }
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('status-dot').className = 'status-dot connected';
        document.getElementById('status-text').textContent = '已连接';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'new_danmaku') {
          showToast('发送成功', '#4ECDC4');
        } else if (msg.type === 'rejected') {
          showToast(msg.message, '#E17055');
        } else if (msg.type === 'error') {
          showToast(msg.message, '#FF8E53');
        }
      };

      ws.onclose = () => {
        document.getElementById('status-dot').className = 'status-dot disconnected';
        document.getElementById('status-text').textContent = '连接断开，3秒后重连...';
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    const input = document.getElementById('danmaku-input');
    const sendBtn = document.getElementById('send-btn');
    const charCount = document.getElementById('char-count');
    const toast = document.getElementById('toast');

    let toastTimer;
    function showToast(msg, bg = '#E17055') {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.background = bg;
      toast.style.color = '#fff';
      toast.style.display = 'block';
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    input.addEventListener('input', () => {
      charCount.textContent = `${input.value.length}/100`;
    });

    function sendDanmaku() {
      const text = input.value.trim();
      if (!text) return showToast('请输入弹幕内容', '#FF8E53');
      if (text.length > 100) return showToast('内容不能超过100字', '#FF8E53');

      if (ws.readyState !== WebSocket.OPEN) {
        return showToast('连接已断开，请稍候重试', '#E17055');
      }

      ws.send(JSON.stringify({ type: 'danmaku', text }));
      input.value = '';
      charCount.textContent = '0/100';
      showToast('审核中...', '#45B7D1');
    }

    sendBtn.addEventListener('click', sendDanmaku);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendDanmaku();
      }
    });

    connect();
  </script>
</body>
</html>
