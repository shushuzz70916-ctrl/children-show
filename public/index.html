<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>儿童艺术展-11：07pm - 匿名留言板</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== Memphis Design Tokens ========== */
    :root {
      --pink: #FF71CE;
      --yellow: #FFCE5C;
      --teal: #86CCCA;
      --purple: #8B6BAE;
      --coral: #FF6B6B;
      --mint: #7ECB9A;
      --lavender: #B8A9E8;
      --bg-deep: #1a1040;
      --bg-mid: #241a4e;
      --border-width: 3px;
      --shadow-offset: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(150deg, #1a1040 0%, #1e1650 35%, #1a1040 65%, #150d35 100%);
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== 波点背景 ========== */
    #polka-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image: radial-gradient(circle, #fff 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* ========== 几何背景画布（精简版） ========== */
    #geofield {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ========== 满月（缩小版） ========== */
    #moon {
      position: absolute;
      top: 4%;
      left: 6%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 42%, rgba(255,235,180,0.98) 0%, rgba(255,210,120,0.88) 35%, rgba(255,185,80,0.55) 65%, rgba(240,160,50,0.22) 100%);
      box-shadow:
        0 0 30px rgba(255, 215, 100, 0.45),
        0 0 80px rgba(255, 190, 60, 0.28),
        0 0 150px rgba(255, 170, 30, 0.12);
      z-index: 1;
      pointer-events: none;
      animation: moonGlow 8s ease-in-out infinite;
    }
    @keyframes moonGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 100, 0.45), 0 0 80px rgba(255, 190, 60, 0.28), 0 0 150px rgba(255, 170, 30, 0.12); }
      50% { box-shadow: 0 0 45px rgba(255, 215, 100, 0.58), 0 0 100px rgba(255, 190, 60, 0.38), 0 0 180px rgba(255, 170, 30, 0.18); }
    }

    /* ========== 孟菲斯面板通用 ========== */
    .memphis-panel {
      background: rgba(26, 16, 64, 0.94);
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--purple);
    }

    /* ========== 装饰几何元素 ========== */
    .geo-triangle-tr {
      position: absolute;
      top: 3%;
      right: 5%;
      width: 50px;
      height: 50px;
      background: var(--teal);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0.55;
      z-index: 1;
      pointer-events: none;
      animation: geoFloat 7s ease-in-out infinite;
    }
    .geo-diamond-bl {
      position: absolute;
      bottom: 12%;
      left: 4%;
      width: 38px;
      height: 38px;
      background: var(--pink);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      opacity: 0.5;
      z-index: 1;
      pointer-events: none;
      animation: geoFloat 8s ease-in-out infinite;
    }
    @keyframes geoFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(6deg); }
    }

    /* ========== Toast ========== */
    #toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 700;
      z-index: 30;
      display: none;
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
      color: #fff;
    }
    @keyframes toastInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ========== 音乐开关 ========== */
    #music-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: var(--border-width) solid rgba(255,255,255,0.85);
      background: rgba(26, 16, 64, 0.92);
      cursor: pointer;
      z-index: 20;
      box-shadow: 4px 4px 0 var(--coral);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.9);
    }
    #music-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--coral);
    }
    #music-btn svg { width: 18px; height: 18px; }

    /* ========== View 1: 角色选择页 ========== */
    #view-roles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 5vw;
    }

    #view-roles h1 {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: clamp(32px, 5vw, 52px);
      text-align: center;
      line-height: 1.5;
      color: #FFF8E7;
      text-shadow:
        0 0 30px rgba(255, 215, 100, 0.5),
        0 0 80px rgba(255, 190, 60, 0.3),
        0 4px 12px rgba(0,0,0,0.4);
      -webkit-text-stroke: 1px rgba(255, 220, 160, 0.2);
      margin-bottom: 32px;
      pointer-events: none;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }

    .role-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .role-card:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--purple);
    }

    .role-card .card-img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.2);
    }
    .role-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .role-card .card-img img.multiply { mix-blend-mode: multiply; }
    .role-card .card-img img.screen { mix-blend-mode: screen; }

    .role-card .card-text .name {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      line-height: 1.3;
    }
    .role-card .card-text .alias {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    /* ========== View 2: 留言页 ========== */
    #view-messages {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      display: none;
      flex-direction: column;
    }

    /* 导航栏 */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      flex-shrink: 0;
      z-index: 6;
      background: rgba(26, 16, 64, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }
    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: var(--border-width) solid rgba(255,255,255,0.7);
      background: rgba(26, 16, 64, 0.9);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 3px 3px 0 var(--purple);
      flex-shrink: 0;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--purple);
    }
    .nav-center {
      text-align: center;
      flex: 1;
      min-width: 0;
      padding: 0 8px;
    }
    .nav-center .role-name {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.05em;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
    }
    .nav-center .role-alias {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
    }

    /* 留言列表 */
    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .message-list:empty::after {
      content: '还没有留言，来说第一句吧';
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 15px;
      font-weight: 600;
      padding-top: 60px;
    }

    .msg-card {
      padding: 14px 18px;
      border-radius: 16px;
      animation: msgIn 0.3s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-card .msg-text {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-card .msg-time {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      margin-top: 6px;
    }

    /* 输入栏 */
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      flex-shrink: 0;
      background: rgba(26, 16, 64, 0.88);
      backdrop-filter: blur(10px);
      border-top: 2px solid rgba(255,255,255,0.15);
      z-index: 6;
    }
    .input-bar input {
      flex: 1;
      padding: 13px 18px;
      font-size: 17px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      outline: none;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
      color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    .input-bar input::placeholder {
      color: rgba(255,255,255,0.3);
      font-weight: 400;
    }
    .input-bar input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255,113,206,0.2);
    }
    .input-bar button {
      padding: 13px 22px;
      font-size: 17px;
      border: var(--border-width) solid rgba(255,255,255,0.9);
      border-radius: 14px;
      background: var(--pink);
      color: #fff;
      cursor: pointer;
      font-family: 'Fredoka', 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
      box-shadow: 4px 4px 0 var(--yellow);
      flex-shrink: 0;
    }
    .input-bar button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--yellow);
      background: #FF8BD8;
    }

    /* 空状态提示 */
    .empty-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.3);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }

    /* 留言前提示 */
    #pre-send-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      flex: 1;
    }
    #pre-send-hint .hint-icon {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.7;
    }
    #pre-send-hint .hint-text {
      color: rgba(255,255,255,0.4);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.6;
    }

    /* 倒计时条 */
    #countdown-bar-wrap {
      flex-shrink: 0;
      height: 4px;
      background: rgba(255,255,255,0.08);
      display: none;
    }
    #countdown-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--pink));
      transition: width 1s linear;
      width: 100%;
    }
    #countdown-text {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      padding: 4px 0 8px;
      display: none;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="polka-bg"></div>
  <canvas id="geofield"></canvas>
  <div id="moon"></div>
  <div class="geo-triangle-tr"></div>
  <div class="geo-diamond-bl"></div>

  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="auto" src="children-light-music.mp3"></audio>

  <!-- ========== View 1: 角色选择 ========== -->
  <div id="view-roles">
    <h1>你最想对哪个生物<br>说些什么？</h1>
    <div class="roles-grid" id="roles-grid"></div>
  </div>

  <!-- ========== View 2: 留言页 ========== -->
  <div id="view-messages">
    <div class="nav-bar">
      <button class="nav-btn" id="nav-back" title="返回">←</button>
      <div class="nav-center">
        <div class="role-name" id="nav-role-name"></div>
        <div class="role-alias" id="nav-role-alias"></div>
      </div>
      <button class="nav-btn" id="nav-next" title="切换角色">→</button>
    </div>
    <div id="pre-send-hint">
      <div class="hint-icon">🔒</div>
      <div class="hint-text">先留言，才能看到<br>大家的悄悄话哦</div>
    </div>
    <div class="message-list" id="message-list" style="display:none;"></div>
    <div id="countdown-bar-wrap"><div id="countdown-bar"></div></div>
    <div id="countdown-text"></div>
    <div class="input-bar">
      <input type="text" id="msg-input" maxlength="100" placeholder="你想说什么呢？" autocomplete="off">
      <button id="send-btn">发送</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 音乐开关 -->
  <button id="music-btn" title="音乐开关">
    <svg id="music-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="music-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <script>
    // ==================== 角色数据 ====================
    const ROLES = [
      { id: 'tree',      name: '树干',   alias: '权力中心',       image: 'assets/大树.png', blend: 'multiply' },
      { id: 'moon',      name: '月亮',   alias: '权力跟班',       image: 'assets/月亮.png', blend: '' },
      { id: 'star',      name: '星星',   alias: '冷眼小队',       image: null,              blend: '' },
      { id: 'birdnest',  name: '鸟巢',   alias: '谣言加工厂',     image: 'assets/鸟巢.png', blend: 'screen' },
      { id: 'falcon',    name: '乌隼',   alias: '悄悄话拆散王',   image: 'assets/乌隼.png', blend: '' },
      { id: 'wind',      name: '风',     alias: '隐形谣言扩音器', image: 'assets/风.png',   blend: '' },
      { id: 'chameleon', name: '变色龙', alias: '',               image: 'assets/变色龙.png', blend: '' },
      { id: 'air',       name: '空气',   alias: '',               image: 'assets/空气.png', blend: '' },
    ];

    let currentRoleIdx = -1;

    // ==================== DOM refs ====================
    const viewRoles = document.getElementById('view-roles');
    const viewMessages = document.getElementById('view-messages');
    const rolesGrid = document.getElementById('roles-grid');
    const messageList = document.getElementById('message-list');
    const preSendHint = document.getElementById('pre-send-hint');
    const countdownBarWrap = document.getElementById('countdown-bar-wrap');
    const countdownBar = document.getElementById('countdown-bar');
    const countdownText = document.getElementById('countdown-text');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const toast = document.getElementById('toast');
    const navBack = document.getElementById('nav-back');
    const navNext = document.getElementById('nav-next');
    const navRoleName = document.getElementById('nav-role-name');
    const navRoleAlias = document.getElementById('nav-role-alias');
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    const musicIconOn = document.getElementById('music-icon-on');
    const musicIconOff = document.getElementById('music-icon-off');

    // ==================== 星星 SVG 图标 ====================
    const STAR_SVG = `<svg width="36" height="36" viewBox="0 0 40 40" fill="none">
      <polygon points="20,4 25,15 37,17 28,26 30,38 20,32 10,38 12,26 3,17 15,15"
        fill="#FFCE5C" stroke="#FFB347" stroke-width="1.5"
        stroke-linejoin="round"/>
    </svg>`;

    // ==================== Toast ====================
    let toastTimer;
    function showToast(msg, bg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.background = bg;
      toast.style.display = 'block';
      toast.style.animation = 'none';
      toast.offsetHeight;
      toast.style.animation = 'toastInOut 2.5s ease forwards';
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ==================== 视图切换 ====================
    function showRolesView() {
      stopCountdown();
      clearIdleTimer();
      viewMessages.style.display = 'none';
      viewRoles.style.display = 'flex';
      musicBtn.style.display = 'flex';
      currentRoleIdx = -1;
    }

    function showMessageView(roleIdx) {
      currentRoleIdx = roleIdx;
      const role = ROLES[roleIdx];
      navRoleName.textContent = role.name;
      navRoleAlias.textContent = role.alias || ' ';
      viewRoles.style.display = 'none';
      viewMessages.style.display = 'flex';
      musicBtn.style.display = 'none';
      msgInput.value = '';

      // 隐藏留言列表和倒计时，显示留言前提示
      messageList.style.display = 'none';
      messageList.innerHTML = '';
      preSendHint.style.display = 'flex';
      countdownBarWrap.style.display = 'none';
      countdownText.style.display = 'none';
      stopCountdown();
      startIdleTimer();
    }

    // ==================== 加载留言 ====================
    async function loadMessages(roleId) {
      messageList.innerHTML = '';
      try {
        const res = await fetch(`/api/messages/${roleId}`);
        const msgs = await res.json();
        if (!Array.isArray(msgs) || msgs.length === 0) {
          messageList.innerHTML = '<div class="empty-hint">还没有留言，来说第一句吧</div>';
          return;
        }
        msgs.forEach(m => appendMessage(m, false));
        messageList.scrollTop = messageList.scrollHeight;
      } catch (err) {
        messageList.innerHTML = '<div class="empty-hint">加载失败，请刷新页面</div>';
      }
    }

    function appendMessage(m, animate) {
      // Remove empty hint if present
      const hint = messageList.querySelector('.empty-hint');
      if (hint) hint.remove();

      const card = document.createElement('div');
      card.className = 'msg-card memphis-panel';
      if (!animate) card.style.animation = 'none';
      card.innerHTML = `
        <div class="msg-text">${escapeHtml(m.text)}</div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
      `;
      messageList.appendChild(card);
      messageList.scrollTop = messageList.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    // ==================== 发送留言 ====================
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return showToast('请输入留言内容', '#FF8E53');
      if (text.length > 100) return showToast('内容不能超过100字', '#FF8E53');
      if (currentRoleIdx < 0) return;

      const role = ROLES[currentRoleIdx];
      showToast('审核中...', '#45B7D1');
      msgInput.value = '';

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: role.id, text }),
        });
        const data = await res.json();
        if (data.rejected) {
          showToast('内容不适合，请重新输入', '#E17055');
        } else if (data.id) {
          // 首次发送成功 → 展示留言列表
          if (preSendHint.style.display !== 'none') {
            clearIdleTimer();
            preSendHint.style.display = 'none';
            messageList.style.display = 'flex';
            await loadMessages(role.id);
          } else {
            appendMessage(data, true);
          }
          startCountdown();
        } else {
          showToast(data.error || '发送失败', '#FF8E53');
        }
      } catch (err) {
        showToast('网络错误，请重试', '#FF8E53');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    // Reset idle timer on any real input (typing/deleting/paste), not just focus
    msgInput.addEventListener('input', () => {
      if (currentRoleIdx >= 0 && preSendHint.style.display !== 'none') {
        startIdleTimer();
      }
    });

    // ==================== 倒计时系统 ====================
    const DISPLAY_DURATION = 60; // 展示留言的秒数
    let countdownTimer = null;
    let countdownRemaining = 0;
    let countdownStartedAt = 0;

    function startCountdown() {
      stopCountdown();
      countdownRemaining = DISPLAY_DURATION;
      countdownStartedAt = Date.now();
      countdownBarWrap.style.display = 'block';
      countdownText.style.display = 'block';
      countdownBar.style.transition = 'none';
      countdownBar.style.width = '100%';
      updateCountdownUI();
      tickCountdown();
    }

    function tickCountdown() {
      const elapsed = (Date.now() - countdownStartedAt) / 1000;
      countdownRemaining = Math.max(0, DISPLAY_DURATION - elapsed);
      updateCountdownUI();

      if (countdownRemaining <= 0) {
        stopCountdown();
        showRolesView();
        return;
      }
      countdownTimer = setTimeout(tickCountdown, 200);
    }

    function updateCountdownUI() {
      const pct = (countdownRemaining / DISPLAY_DURATION) * 100;
      if (countdownRemaining <= 0) {
        countdownBar.style.transition = 'none';
        countdownBar.style.width = '0%';
      } else {
        countdownBar.style.transition = 'width 0.2s linear';
        countdownBar.style.width = pct + '%';
      }
      const sec = Math.ceil(countdownRemaining);
      countdownText.textContent = sec + ' 秒后自动返回首页';
    }

    function stopCountdown() {
      clearTimeout(countdownTimer);
      countdownTimer = null;
    }

    // ==================== 空闲超时 ====================
    const IDLE_TIMEOUT = 120; // 进入留言页但不发消息，2分钟后自动返回
    let idleTimer = null;

    function startIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (preSendHint.style.display !== 'none') {
          // 还没发过留言，自动返回
          showRolesView();
        }
      }, IDLE_TIMEOUT * 1000);
    }

    function clearIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = null;
    }

    // ==================== 角色切换 ====================
    navBack.addEventListener('click', showRolesView);

    navNext.addEventListener('click', () => {
      const nextIdx = (currentRoleIdx + 1) % ROLES.length;
      showMessageView(nextIdx);
    });

    // 左右滑动手势切换（可选增强）
    let touchStartX = 0;
    viewMessages.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    viewMessages.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 80) {
        const nextIdx = dx < 0
          ? (currentRoleIdx + 1) % ROLES.length
          : (currentRoleIdx - 1 + ROLES.length) % ROLES.length;
        showMessageView(nextIdx);
      }
    });

    // ==================== 构建角色卡片 ====================
    function buildRoleCards() {
      ROLES.forEach((role, i) => {
        const card = document.createElement('div');
        card.className = 'role-card memphis-panel';

        let imgHtml;
        if (role.image) {
          const blendClass = role.blend || '';
          imgHtml = `<img src="${role.image}" alt="${role.name}" class="${blendClass}" loading="lazy">`;
        } else {
          imgHtml = STAR_SVG;
        }

        card.innerHTML = `
          <div class="card-img">${imgHtml}</div>
          <div class="card-text">
            <div class="name">${role.name}</div>
            ${role.alias ? `<div class="alias">${role.alias}</div>` : ''}
          </div>
        `;
        card.addEventListener('click', () => showMessageView(i));
        rolesGrid.appendChild(card);
      });
    }
    buildRoleCards();

    // ==================== 背景音乐 ====================
    let musicOn = true;
    bgm.volume = 0.3;

    function updateMusicUI() {
      if (musicOn) {
        musicIconOn.style.display = 'block';
        musicIconOff.style.display = 'none';
        musicBtn.style.color = 'rgba(255,255,255,0.9)';
        musicBtn.style.background = 'rgba(26, 16, 64, 0.92)';
      } else {
        musicIconOn.style.display = 'none';
        musicIconOff.style.display = 'block';
        musicBtn.style.color = 'rgba(255,255,255,0.4)';
        musicBtn.style.background = 'rgba(26, 16, 64, 0.6)';
      }
    }

    function tryAutoplay() {
      bgm.play().then(() => {
        musicOn = true;
        updateMusicUI();
      }).catch(() => {
        musicOn = false;
        updateMusicUI();
      });
    }
    tryAutoplay();

    document.addEventListener('click', () => {
      if (musicOn && bgm.paused) {
        bgm.play().catch(() => {});
      }
    }, { once: true });

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (musicOn) {
        bgm.pause();
        musicOn = false;
      } else {
        bgm.play().then(() => { musicOn = true; }).catch(() => {});
        musicOn = true;
      }
      updateMusicUI();
    });

    // ==================== 孟菲斯几何背景（精简版） ====================
    const geofield = document.getElementById('geofield');
    const geoCtx = geofield.getContext('2d');
    let geoShapes = [];
    const SHAPE_COUNT = 50;

    const memphisColors = [
      '#FF71CE', '#FFCE5C', '#86CCCA', '#8B6BAE',
      '#FF6B6B', '#7ECB9A', '#B8A9E8', '#FFB347',
    ];

    function resizeGeofield() {
      geofield.width = window.innerWidth;
      geofield.height = window.innerHeight;
    }

    function createGeoShapes() {
      geoShapes = [];
      for (let i = 0; i < SHAPE_COUNT; i++) {
        geoShapes.push({
          type: Math.floor(Math.random() * 5),
          x: Math.random() * geofield.width,
          y: Math.random() * geofield.height,
          size: Math.random() * 8 + 3,
          color: memphisColors[Math.floor(Math.random() * memphisColors.length)],
          baseAlpha: Math.random() * 0.18 + 0.06,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.003,
          floatSpeed: Math.random() * 0.012 + 0.003,
          floatPhase: Math.random() * Math.PI * 2,
        });
      }
    }

    function drawGeoShapes() {
      geoCtx.clearRect(0, 0, geofield.width, geofield.height);
      const t = Date.now() / 1000;

      for (const s of geoShapes) {
        const yOffset = Math.sin(t * s.floatSpeed * 8 + s.floatPhase) * 6;
        const alpha = s.baseAlpha + Math.sin(t * 0.7 + s.floatPhase) * 0.04;
        geoCtx.globalAlpha = Math.max(0.03, Math.min(0.28, alpha));
        geoCtx.fillStyle = s.color;
        geoCtx.strokeStyle = s.color;
        geoCtx.lineWidth = 1.2;

        const rot = s.rotation + t * s.rotSpeed;
        const dy = s.y + yOffset;

        geoCtx.save();
        geoCtx.translate(s.x, dy);
        geoCtx.rotate(rot);
        switch (s.type) {
          case 0: // circle
            geoCtx.beginPath();
            geoCtx.arc(0, 0, s.size, 0, Math.PI * 2);
            geoCtx.fill();
            break;
          case 1: // triangle
            geoCtx.beginPath();
            geoCtx.moveTo(0, -s.size);
            geoCtx.lineTo(-s.size * 0.866, s.size * 0.5);
            geoCtx.lineTo(s.size * 0.866, s.size * 0.5);
            geoCtx.closePath();
            geoCtx.fill();
            break;
          case 2: // diamond
            geoCtx.beginPath();
            geoCtx.moveTo(0, -s.size);
            geoCtx.lineTo(s.size * 0.7, 0);
            geoCtx.lineTo(0, s.size);
            geoCtx.lineTo(-s.size * 0.7, 0);
            geoCtx.closePath();
            geoCtx.fill();
            break;
          case 3: // cross
            geoCtx.fillRect(-s.size * 0.55, -s.size * 0.2, s.size * 1.1, s.size * 0.4);
            geoCtx.fillRect(-s.size * 0.2, -s.size * 0.55, s.size * 0.4, s.size * 1.1);
            break;
          case 4: // ring
            geoCtx.beginPath();
            geoCtx.arc(0, 0, s.size, 0, Math.PI * 2);
            geoCtx.stroke();
            break;
        }
        geoCtx.restore();
      }
      geoCtx.globalAlpha = 1;
      requestAnimationFrame(drawGeoShapes);
    }

    resizeGeofield();
    createGeoShapes();
    drawGeoShapes();
    window.addEventListener('resize', () => {
      resizeGeofield();
      createGeoShapes();
    });
  </script>
</body>
</html>
