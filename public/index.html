<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>儿童艺术展-11：07pm - 匿名留言板</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== Starry Lullaby Design Tokens ========== */
    :root {
      --bg-deep: #060E24;
      --bg-mid: #0D1A3E;
      --bg-light: #142050;
      --gold: #D4A030;
      --gold-light: #FFE8A0;
      --gold-dark: #C09028;
      --card-bg: linear-gradient(135deg, rgba(18,30,60,0.75) 0%, rgba(10,20,45,0.8) 100%);
      --card-border: rgba(255,215,100,0.18);
      --card-highlight: rgba(255,235,160,0.35);
      --text: rgba(255,255,255,0.9);
      --text-muted: rgba(255,210,130,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 35%, var(--bg-light) 65%, var(--bg-deep) 100%);
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== 星空点阵（浓密） ========== */
    #starfield-deep {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      opacity: 0.7;
      background-image:
        radial-gradient(0.6px 0.6px at 5% 10%, rgba(255,230,160,0.3), transparent),
        radial-gradient(0.5px 0.5px at 12% 30%, rgba(255,255,255,0.2), transparent),
        radial-gradient(0.5px 0.5px at 22% 8%, rgba(255,220,140,0.25), transparent),
        radial-gradient(0.4px 0.4px at 30% 25%, rgba(255,255,255,0.15), transparent),
        radial-gradient(0.7px 0.7px at 42% 28%, rgba(255,255,255,0.35), transparent),
        radial-gradient(0.4px 0.4px at 58% 18%, rgba(255,255,255,0.15), transparent),
        radial-gradient(0.5px 0.5px at 68% 32%, rgba(255,230,160,0.25), transparent),
        radial-gradient(0.4px 0.4px at 78% 20%, rgba(255,255,255,0.18), transparent),
        radial-gradient(0.6px 0.6px at 88% 30%, rgba(255,220,140,0.28), transparent),
        radial-gradient(0.5px 0.5px at 15% 45%, rgba(255,255,255,0.22), transparent),
        radial-gradient(0.4px 0.4px at 35% 48%, rgba(255,255,255,0.15), transparent),
        radial-gradient(0.6px 0.6px at 55% 42%, rgba(255,230,160,0.28), transparent),
        radial-gradient(0.5px 0.5px at 72% 45%, rgba(255,255,255,0.2), transparent),
        radial-gradient(0.4px 0.4px at 90% 44%, rgba(255,255,255,0.12), transparent);
    }
    #starfield-mid {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1.8px 1.8px at 10% 15%, rgba(255,235,160,0.75), transparent),
        radial-gradient(2.2px 2.2px at 25% 22%, rgba(255,240,170,0.8), transparent),
        radial-gradient(1.4px 1.4px at 38% 10%, rgba(255,225,150,0.65), transparent),
        radial-gradient(2.0px 2.0px at 50% 6%, rgba(255,230,155,0.7), transparent),
        radial-gradient(1.6px 1.6px at 62% 18%, rgba(255,235,160,0.75), transparent),
        radial-gradient(1.2px 1.2px at 72% 8%, rgba(255,220,140,0.55), transparent),
        radial-gradient(2.4px 2.4px at 85% 14%, rgba(255,240,170,0.85), transparent),
        radial-gradient(1.8px 1.8px at 18% 35%, rgba(255,225,150,0.6), transparent),
        radial-gradient(2.0px 2.0px at 40% 30%, rgba(255,230,155,0.7), transparent),
        radial-gradient(1.5px 1.5px at 58% 36%, rgba(255,225,150,0.55), transparent),
        radial-gradient(2.2px 2.2px at 75% 32%, rgba(255,240,170,0.8), transparent),
        radial-gradient(1.3px 1.3px at 92% 28%, rgba(255,220,140,0.5), transparent),
        radial-gradient(0.8px 0.8px at 5% 42%, rgba(255,255,255,0.25), transparent),
        radial-gradient(1.0px 1.0px at 32% 44%, rgba(255,225,150,0.4), transparent),
        radial-gradient(1.4px 1.4px at 68% 42%, rgba(255,230,155,0.55), transparent);
    }
    /* 星星闪烁动画（缓慢呼吸，远近层不同节奏） */
    @media (prefers-reduced-motion: no-preference) {
      #starfield-deep {
        animation: starBreatheDeep 7s ease-in-out infinite;
      }
      #starfield-mid {
        animation: starBreatheMid 3.2s ease-in-out infinite;
      }
      #moon-ambient {
        animation: ambientPulse 5s ease-in-out infinite;
      }
    }
    @keyframes starBreatheDeep {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.78; }
    }
    @keyframes starBreatheMid {
      0%, 100% { opacity: 0.7; }
      40% { opacity: 1.0; }
      75% { opacity: 0.72; }
    }
    @keyframes ambientPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1.0; }
    }

    /* ========== 月光环境光 ========== */
    #moon-ambient {
      position: absolute;
      top: -6%; right: 0%;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,225,140,0.1) 0%, transparent 70%);
      z-index: 0; pointer-events: none;
    }

    /* ========== 满月 ========== */
    #moon {
      position: absolute;
      top: 4%; right: 8%;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 36%, rgba(255,245,185,0.85) 0%, rgba(255,220,100,0.4) 40%, transparent 65%);
      box-shadow: 0 0 30px rgba(255,215,100,0.35), 0 0 80px rgba(255,190,50,0.12);
      z-index: 1; pointer-events: none;
      animation: moonGlow 8s ease-in-out infinite;
    }
    @keyframes moonGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(255,215,100,0.35), 0 0 80px rgba(255,190,50,0.12); }
      50% { box-shadow: 0 0 45px rgba(255,215,100,0.5), 0 0 100px rgba(255,190,50,0.2); }
    }

    /* ========== 星空面板通用 ========== */
    .memphis-panel {
      background: linear-gradient(135deg, rgba(18,30,60,0.75) 0%, rgba(10,20,45,0.8) 100%);
      border: 1px solid var(--card-border);
      border-top: 1px solid var(--card-highlight);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), 0 1px 0 rgba(255,215,100,0.06) inset, 0 8px 32px rgba(0,0,0,0.25);
    }

    /* ========== Toast ========== */
    #toast {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px; border-radius: 14px;
      font-size: 15px;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 700; z-index: 30; display: none;
      border: 1.5px solid rgba(255,215,100,0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      color: #fff;
    }
    @keyframes toastInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ========== 音乐开关 ========== */
    #music-btn {
      position: absolute; top: 20px; right: 20px;
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid rgba(255,215,100,0.25);
      background: rgba(15,28,55,0.8);
      cursor: pointer; z-index: 20;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.8);
    }
    #music-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0 1px 6px rgba(0,0,0,0.25);
    }
    #music-btn svg { width: 18px; height: 18px; }

    /* ========== View 1: 角色选择页 ========== */
    #view-roles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 5vw;
    }

    #view-roles h1 {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: clamp(30px, 5vw, 48px);
      text-align: center; line-height: 1.5;
      color: var(--gold-light);
      text-shadow: 0 0 30px rgba(255,215,100,0.3), 0 2px 8px rgba(0,0,0,0.5);
      margin-bottom: 24px; pointer-events: none;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }

    .role-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .role-card:active {
      transform: translate(2px, 2px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.35), 0 0 16px rgba(255,215,100,0.15);
    }

    .role-card .card-img {
      width: 44px; height: 44px;
      border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .role-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .role-card .card-img img.multiply { mix-blend-mode: multiply; }
    .role-card .card-img img.screen { mix-blend-mode: screen; }

    .role-card .card-text .name {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      line-height: 1.3;
    }
    .role-card .card-text .alias {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    /* ========== View 2: 留言页 ========== */
    #view-messages {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      display: none;
      flex-direction: column;
    }

    /* 导航栏 */
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; flex-shrink: 0; z-index: 6;
      background: linear-gradient(180deg, rgba(8,18,42,0.85) 0%, rgba(8,18,42,0.5) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,215,100,0.12);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .nav-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid rgba(255,215,100,0.25);
      background: rgba(15,28,55,0.7);
      color: rgba(255,255,255,0.75); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      flex-shrink: 0;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .nav-center {
      text-align: center;
      flex: 1;
      min-width: 0;
      padding: 0 8px;
    }
    .nav-center .role-name {
      font-size: 22px; font-weight: 800; color: #fff;
      letter-spacing: 0.05em; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
    }
    .nav-center .role-alias {
      font-size: 11px; font-weight: 600;
      color: rgba(255,210,130,0.4); margin-top: 2px;
    }

    /* 留言列表 */
    .message-list {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .msg-card {
      padding: 14px 18px;
      border-radius: 16px;
      animation: msgIn 0.3s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-card .msg-text {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-card .msg-time {
      font-size: 10px; font-weight: 600;
      color: rgba(255,210,130,0.35); margin-top: 6px;
    }

    /* 输入栏 */
    .input-bar {
      display: flex; gap: 8px;
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      flex-shrink: 0;
      background: linear-gradient(0deg, rgba(8,18,42,0.85) 0%, rgba(8,18,42,0.5) 100%);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,215,100,0.12);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
      z-index: 6;
    }
    .input-bar input {
      flex: 1; padding: 10px 14px; font-size: 16px;
      border: 1px solid rgba(255,215,100,0.2);
      border-radius: 12px; outline: none;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 600;
      background: rgba(0,0,0,0.2);
      color: #fff;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    .input-bar input::placeholder {
      color: rgba(255,255,255,0.25); font-weight: 400;
    }
    .input-bar input:focus {
      border-color: var(--gold);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 0 4px rgba(212,160,48,0.15);
    }
    .input-bar button {
      padding: 10px 18px; font-size: 16px;
      border: none; border-top: 1px solid rgba(255,240,180,0.4);
      border-radius: 12px;
      background: linear-gradient(180deg, #E0B840 0%, #C09028 100%);
      color: #fff; cursor: pointer;
      font-family: 'Fredoka', 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 700; letter-spacing: 0.04em;
      white-space: nowrap;
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
      box-shadow: 0 3px 12px rgba(180,130,30,0.3);
      flex-shrink: 0;
    }
    .input-bar button:active {
      transform: translate(1px, 1px);
      box-shadow: 0 1px 6px rgba(180,130,30,0.3);
    }
    .input-bar button:disabled {
      opacity: 0.5; cursor: not-allowed;
      transform: none; box-shadow: 0 3px 12px rgba(180,130,30,0.3);
    }

    /* 空状态提示 */
    .empty-hint {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.25);
      font-size: 15px; font-weight: 600; text-align: center;
    }

    /* 留言前提示 */
    #pre-send-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      flex: 1;
    }
    #pre-send-hint .hint-icon {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.7;
    }
    #pre-send-hint .hint-text {
      color: rgba(255,255,255,0.35);
      font-size: 16px; font-weight: 700; line-height: 1.6;
    }

    /* 倒计时条 */
    #countdown-bar-wrap {
      flex-shrink: 0; height: 3px;
      background: rgba(255,255,255,0.06); display: none;
    }
    #countdown-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      box-shadow: 0 0 6px rgba(200,160,50,0.3);
      transition: width 1s linear; width: 100%;
    }
    #countdown-text {
      text-align: center; font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,0.25); padding: 4px 0 6px;
      display: none; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 星空背景 -->
  <div id="starfield-deep"></div>
  <div id="starfield-mid"></div>
  <!-- 月光环境光 -->
  <div id="moon-ambient"></div>
  <div id="moon"></div>

  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="auto" src="children-light-music.mp3"></audio>

  <!-- ========== View 1: 角色选择 ========== -->
  <div id="view-roles">
    <h1>你最想对哪个生物<br>说些什么？</h1>
    <div class="roles-grid" id="roles-grid"></div>
  </div>

  <!-- ========== View 2: 留言页 ========== -->
  <div id="view-messages">
    <div class="nav-bar">
      <button class="nav-btn" id="nav-back" title="返回">←</button>
      <div class="nav-center">
        <div class="role-name" id="nav-role-name"></div>
        <div class="role-alias" id="nav-role-alias"></div>
      </div>
      <button class="nav-btn" id="nav-next" title="切换角色">→</button>
    </div>
    <div id="pre-send-hint">
      <div class="hint-icon">🔒</div>
      <div class="hint-text">先留言，才能看到<br>大家的悄悄话哦</div>
    </div>
    <div class="message-list" id="message-list" style="display:none;"></div>
    <div id="countdown-bar-wrap"><div id="countdown-bar"></div></div>
    <div id="countdown-text"></div>
    <div class="input-bar">
      <input type="text" id="msg-input" maxlength="100" placeholder="你想说什么呢？" autocomplete="off">
      <button id="send-btn">发送</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 音乐开关 -->
  <button id="music-btn" title="音乐开关">
    <svg id="music-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="music-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <script>
    // ==================== 角色数据（从 API 加载） ====================
    const ROLE_BLENDS = { tree: 'multiply', birdnest: 'screen' };
    let ROLES = [];

    async function initRoles() {
      try {
        const res = await fetch('/api/roles');
        if (!res.ok) throw new Error('Failed to load roles');
        const serverRoles = await res.json();
        ROLES = serverRoles.map(r => ({
          ...r,
          blend: ROLE_BLENDS[r.id] || ''
        }));
      } catch {
        // API 失败则无法使用，显示错误状态
        rolesGrid.innerHTML = '<div class="empty-hint" style="color:rgba(255,255,255,0.5);font-size:18px;">角色加载失败<br>请刷新页面</div>';
        return;
      }
      buildRoleCards();
    }

    let currentRoleIdx = -1;

    // ==================== DOM refs ====================
    const viewRoles = document.getElementById('view-roles');
    const viewMessages = document.getElementById('view-messages');
    const rolesGrid = document.getElementById('roles-grid');
    const messageList = document.getElementById('message-list');
    const preSendHint = document.getElementById('pre-send-hint');
    const countdownBarWrap = document.getElementById('countdown-bar-wrap');
    const countdownBar = document.getElementById('countdown-bar');
    const countdownText = document.getElementById('countdown-text');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const toast = document.getElementById('toast');
    const navBack = document.getElementById('nav-back');
    const navNext = document.getElementById('nav-next');
    const navRoleName = document.getElementById('nav-role-name');
    const navRoleAlias = document.getElementById('nav-role-alias');
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    const musicIconOn = document.getElementById('music-icon-on');
    const musicIconOff = document.getElementById('music-icon-off');

    // ==================== 星星 SVG 图标 ====================
    const STAR_SVG = `<svg width="36" height="36" viewBox="0 0 40 40" fill="none">
      <polygon points="20,4 25,15 37,17 28,26 30,38 20,32 10,38 12,26 3,17 15,15"
        fill="#FFCE5C" stroke="#FFB347" stroke-width="1.5"
        stroke-linejoin="round"/>
    </svg>`;

    // ==================== Toast ====================
    let toastTimer;
    function showToast(msg, bg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.background = bg;
      toast.style.display = 'block';
      toast.style.animation = 'none';
      toast.offsetHeight;
      toast.style.animation = 'toastInOut 2.5s ease forwards';
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ==================== 视图切换 ====================
    function showRolesView() {
      stopCountdown();
      clearIdleTimer();
      viewMessages.style.display = 'none';
      viewRoles.style.display = 'flex';
      musicBtn.style.display = 'flex';
      currentRoleIdx = -1;
    }

    function showMessageView(roleIdx) {
      currentRoleIdx = roleIdx;
      const role = ROLES[roleIdx];
      navRoleName.textContent = role.name;
      navRoleAlias.textContent = role.alias || ' ';
      viewRoles.style.display = 'none';
      viewMessages.style.display = 'flex';
      musicBtn.style.display = 'none';
      msgInput.value = '';

      // 隐藏留言列表和倒计时，显示留言前提示
      messageList.style.display = 'none';
      messageList.innerHTML = '';
      preSendHint.style.display = 'flex';
      countdownBarWrap.style.display = 'none';
      countdownText.style.display = 'none';
      stopCountdown();
      startIdleTimer();
    }

    // ==================== 加载留言 ====================
    async function loadMessages(roleId) {
      messageList.innerHTML = '';
      try {
        const res = await fetch(`/api/messages/${roleId}`);
        if (!res.ok) {
          messageList.innerHTML = '<div class="empty-hint">加载失败，请刷新页面</div>';
          return;
        }
        const msgs = await res.json();
        if (!Array.isArray(msgs) || msgs.length === 0) {
          messageList.innerHTML = '<div class="empty-hint">还没有留言，来说第一句吧</div>';
          return;
        }
        msgs.forEach(m => appendMessage(m, false));
        messageList.scrollTop = messageList.scrollHeight;
      } catch (err) {
        messageList.innerHTML = '<div class="empty-hint">加载失败，请刷新页面</div>';
      }
    }

    function appendMessage(m, animate) {
      // Remove empty hint if present
      const hint = messageList.querySelector('.empty-hint');
      if (hint) hint.remove();

      const card = document.createElement('div');
      card.className = 'msg-card memphis-panel';
      if (!animate) card.style.animation = 'none';
      card.innerHTML = `
        <div class="msg-text">${escapeHtml(m.text)}</div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
      `;
      messageList.appendChild(card);
      messageList.scrollTop = messageList.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(str) {
      if (!str || str.length < 19) return '';
      const hh = str.slice(11, 13);
      const mm = str.slice(14, 16);
      const ss = str.slice(17, 19);
      return `${hh}:${mm}:${ss}`;
    }

    // ==================== 发送留言 ====================
    let sending = false;

    function setSendingState(disabled) {
      sending = disabled;
      sendBtn.disabled = disabled;
      sendBtn.textContent = disabled ? '发送中...' : '发送';
      msgInput.disabled = disabled;
    }

    async function sendMessage() {
      if (sending) return;
      const text = msgInput.value.trim();
      if (!text) return showToast('请输入留言内容', '#FF8E53');
      if (text.length > 100) return showToast('内容不能超过100字', '#FF8E53');
      if (currentRoleIdx < 0) return;

      const role = ROLES[currentRoleIdx];
      showToast('审核中...', '#45B7D1');
      setSendingState(true);
      msgInput.value = '';

      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: role.id, text }),
        });
        const data = await res.json();
        if (data.rejected) {
          showToast('内容不适合，请重新输入', '#E17055');
        } else if (data.id) {
          if (preSendHint.style.display !== 'none') {
            clearIdleTimer();
            preSendHint.style.display = 'none';
            messageList.style.display = 'flex';
            await loadMessages(role.id);
          } else {
            appendMessage(data, true);
          }
          startCountdown();
        } else {
          showToast(data.error || '发送失败', '#FF8E53');
        }
      } catch (err) {
        showToast('网络错误，请重试', '#FF8E53');
      } finally {
        setSendingState(false);
        msgInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    // Reset idle timer on any real input (typing/deleting/paste), not just focus
    msgInput.addEventListener('input', () => {
      if (currentRoleIdx >= 0 && preSendHint.style.display !== 'none') {
        startIdleTimer();
      }
    });

    // ==================== 倒计时系统 ====================
    const DISPLAY_DURATION = 60; // 展示留言的秒数
    let countdownTimer = null;
    let countdownRemaining = 0;
    let countdownStartedAt = 0;

    function startCountdown() {
      stopCountdown();
      countdownRemaining = DISPLAY_DURATION;
      countdownStartedAt = Date.now();
      countdownBarWrap.style.display = 'block';
      countdownText.style.display = 'block';
      countdownBar.style.transition = 'none';
      countdownBar.style.width = '100%';
      updateCountdownUI();
      tickCountdown();
    }

    function tickCountdown() {
      const elapsed = (Date.now() - countdownStartedAt) / 1000;
      countdownRemaining = Math.max(0, DISPLAY_DURATION - elapsed);
      updateCountdownUI();

      if (countdownRemaining <= 0) {
        stopCountdown();
        showRolesView();
        return;
      }
      countdownTimer = setTimeout(tickCountdown, 200);
    }

    function updateCountdownUI() {
      const pct = (countdownRemaining / DISPLAY_DURATION) * 100;
      if (countdownRemaining <= 0) {
        countdownBar.style.transition = 'none';
        countdownBar.style.width = '0%';
      } else {
        countdownBar.style.transition = 'width 0.2s linear';
        countdownBar.style.width = pct + '%';
      }
      const sec = Math.ceil(countdownRemaining);
      countdownText.textContent = sec + ' 秒后自动返回首页';
    }

    function stopCountdown() {
      clearTimeout(countdownTimer);
      countdownTimer = null;
    }

    // ==================== 空闲超时 ====================
    const IDLE_TIMEOUT = 120; // 进入留言页但不发消息，2分钟后自动返回
    let idleTimer = null;

    function startIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (preSendHint.style.display !== 'none') {
          // 还没发过留言，自动返回
          showRolesView();
        }
      }, IDLE_TIMEOUT * 1000);
    }

    function clearIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = null;
    }

    // ==================== 角色切换 ====================
    navBack.addEventListener('click', showRolesView);

    navNext.addEventListener('click', () => {
      const nextIdx = (currentRoleIdx + 1) % ROLES.length;
      showMessageView(nextIdx);
    });

    // 左右滑动手势切换（可选增强）
    let touchStartX = 0;
    viewMessages.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    viewMessages.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 80) {
        const nextIdx = dx < 0
          ? (currentRoleIdx + 1) % ROLES.length
          : (currentRoleIdx - 1 + ROLES.length) % ROLES.length;
        showMessageView(nextIdx);
      }
    });

    // ==================== 构建角色卡片 ====================
    function buildRoleCards() {
      ROLES.forEach((role, i) => {
        const card = document.createElement('div');
        card.className = 'role-card memphis-panel';

        let imgHtml;
        if (role.image) {
          const blendClass = role.blend || '';
          imgHtml = `<img src="${role.image}" alt="${role.name}" class="${blendClass}" loading="lazy">`;
        } else {
          imgHtml = STAR_SVG;
        }

        card.innerHTML = `
          <div class="card-img">${imgHtml}</div>
          <div class="card-text">
            <div class="name">${role.name}</div>
            ${role.alias ? `<div class="alias">${role.alias}</div>` : ''}
          </div>
        `;
        card.addEventListener('click', () => showMessageView(i));
        rolesGrid.appendChild(card);
      });
    }
    initRoles();

    // ==================== 背景音乐 ====================
    let musicOn = false;
    bgm.volume = 0.3;

    function updateMusicUI() {
      if (musicOn) {
        musicIconOn.style.display = 'block';
        musicIconOff.style.display = 'none';
      } else {
        musicIconOn.style.display = 'none';
        musicIconOff.style.display = 'block';
      }
    }
    updateMusicUI();

    // 首次用户交互时尝试播放
    document.addEventListener('click', () => {
      if (!musicOn) {
        bgm.play().then(() => {
          musicOn = true;
          updateMusicUI();
        }).catch(() => {});
      }
    }, { once: true });

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (musicOn) {
        bgm.pause();
        musicOn = false;
      } else {
        bgm.play().then(() => {
          musicOn = true;
          updateMusicUI();
        }).catch(() => {});
      }
      updateMusicUI();
    });

  </script>
</body>
</html>
