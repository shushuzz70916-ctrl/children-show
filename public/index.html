<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSTART儿童艺术展-11：07PM - 弹幕互动</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(160deg, #0a0a1a 0%, #12102a 30%, #1a1040 60%, #0f0f2a 100%);
      font-family: 'Nunito', 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      position: relative;
    }

    /* 星空画布 */
    #starfield {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 满月 */
    #moon {
      position: absolute;
      top: 6%;
      left: 10%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 42%, rgba(255,245,210,0.98) 0%, rgba(255,235,170,0.88) 35%, rgba(255,218,120,0.65) 65%, rgba(245,200,85,0.28) 100%);
      box-shadow:
        0 0 50px rgba(255,220,100,0.58),
        0 0 120px rgba(255,200,70,0.38),
        0 0 220px rgba(255,185,50,0.18),
        0 0 380px rgba(255,190,55,0.10),
        0 0 600px rgba(255,200,60,0.05);
      z-index: 1;
      pointer-events: none;
      animation: moonGlow 8s ease-in-out infinite;
    }
    @keyframes moonGlow {
      0%, 100% { box-shadow: 0 0 50px rgba(255,220,100,0.58), 0 0 120px rgba(255,200,70,0.38), 0 0 220px rgba(255,185,50,0.18), 0 0 380px rgba(255,190,55,0.10), 0 0 600px rgba(255,200,60,0.05); }
      50% { box-shadow: 0 0 70px rgba(255,220,100,0.68), 0 0 150px rgba(255,200,70,0.48), 0 0 260px rgba(255,185,50,0.26), 0 0 420px rgba(255,190,55,0.15), 0 0 680px rgba(255,200,60,0.08); }
    }

    /* 弹幕层 */
    #danmaku-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Nunito', 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      text-shadow: 0 0 18px currentColor;
      animation: scroll-left linear forwards;
      pointer-events: none;
      letter-spacing: 0.02em;
    }
    @keyframes scroll-left {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* 标题 */
    #title-area {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    #title-area h1 {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: 96px;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #FF7B7B 0%, #FFD93D 50%, #FFB347 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      -webkit-text-stroke: 1.5px rgba(10,10,26,0.35);
      opacity: 0.82;
      filter: drop-shadow(0 0 60px rgba(255,160,80,0.50)) drop-shadow(0 0 120px rgba(255,180,60,0.30));
      animation: titleFloat 5s ease-in-out infinite, titleShimmer 6s ease-in-out infinite;
    }
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes titleShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* 玻璃面板通用 */
    .glass-panel {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.10);
    }

    /* 输入区 */
    #input-area {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
      padding: 8px;
      border-radius: 40px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    #input-area input {
      width: 340px;
      padding: 12px 22px;
      font-size: 18px;
      border: none;
      border-radius: 32px;
      outline: none;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      background: rgba(255,255,255,0.10);
      color: #fff;
      transition: background 0.25s, box-shadow 0.25s;
    }
    #input-area input::placeholder {
      color: rgba(255,255,255,0.35);
      font-weight: 400;
    }
    #input-area input:focus {
      background: rgba(255,255,255,0.16);
      box-shadow: 0 0 0 3px rgba(255,123,123,0.25);
    }
    #input-area button {
      padding: 12px 26px;
      font-size: 18px;
      border: none;
      border-radius: 32px;
      background: linear-gradient(135deg, #FF7B7B, #FF8E73);
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255,123,123,0.3);
    }
    #input-area button:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 24px rgba(255,123,123,0.45);
    }
    #input-area button:active { transform: scale(0.96); }

    /* Toast */
    #toast {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      border-radius: 28px;
      font-size: 16px;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      z-index: 30;
      display: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.10);
      animation: fadeInOut 2.5s ease forwards;
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 二维码卡片 */
    #qr-area {
      position: absolute;
      bottom: 28px;
      right: 28px;
      border-radius: 24px;
      padding: 20px 20px 14px;
      text-align: center;
      z-index: 20;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    #qr-area img {
      width: 130px;
      height: 130px;
      display: block;
      border-radius: 12px;
      background: #fff;
      padding: 4px;
    }
    #qr-area p {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* 音乐开关 */
    #music-btn {
      position: absolute;
      top: 36px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.85);
    }
    #music-btn:hover {
      transform: scale(1.1);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }
    #music-btn svg {
      width: 20px;
      height: 20px;
    }

    /* 链接提示 */
    #link-hint {
      position: absolute;
      bottom: 28px;
      left: 28px;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      z-index: 20;
      font-family: 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 星空背景 -->
  <canvas id="starfield"></canvas>

  <!-- 满月 -->
  <div id="moon"></div>

  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="auto"
         src="小咪屁屁奇迹.mp3">
  </audio>

  <!-- 弹幕层 -->
  <div id="danmaku-layer"></div>

  <!-- 标题 -->
  <div id="title-area">
    <h1>iSTART儿童艺术展-11：07PM</h1>
  </div>

  <!-- 输入框 -->
  <div id="input-area">
    <input id="danmaku-input" type="text" maxlength="100"
           placeholder="输入弹幕，一起互动吧~" autofocus>
    <button id="send-btn">发送</button>
  </div>

  <!-- 提示 -->
  <div id="toast"></div>

  <!-- 二维码 -->
  <div id="qr-area">
    <img id="qr-img" src="" alt="扫码发送弹幕">
    <p>扫码发送弹幕</p>
  </div>

  <!-- 音乐开关 -->
  <button id="music-btn" title="音乐开关">
    <svg id="music-icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="music-icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- 链接 -->
  <div id="link-hint" style="display:none;">
    手机发送：<span id="send-url-text"></span>
  </div>

  <script>
    // ==================== 星空背景 ====================
    const starCanvas = document.getElementById('starfield');
    const starCtx = starCanvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 160;

    function resizeStarfield() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
    }
    function createStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          r: Math.random() * 1.8 + 0.4,
          baseAlpha: Math.random() * 0.5 + 0.15,
          speed: Math.random() * 0.015 + 0.004,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    function animateStars() {
      starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      const t = Date.now() / 1000;
      for (const s of stars) {
        const flicker = Math.sin(t * s.speed * 12 + s.phase) * 0.25;
        const alpha = Math.max(0.05, Math.min(1, s.baseAlpha + flicker));
        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(255,255,255,${alpha})`;
        starCtx.fill();
      }
      requestAnimationFrame(animateStars);
    }
    resizeStarfield();
    createStars();
    animateStars();
    window.addEventListener('resize', () => {
      resizeStarfield();
      createStars();
    });

    // ==================== WebSocket ====================
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    let wsReconnectTimer = null;

    const danmakuLayer = document.getElementById('danmaku-layer');
    const input = document.getElementById('danmaku-input');
    const sendBtn = document.getElementById('send-btn');
    const toast = document.getElementById('toast');
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    const musicIconOn = document.getElementById('music-icon-on');
    const musicIconOff = document.getElementById('music-icon-off');

    // ==================== 弹幕系统 ====================
    const colors = [
      '#FF7B7B', '#FFB08C', '#FFD93D', '#FFE0A3',
      '#4ECDC4', '#7EDDD6', '#A8D8EA', '#C3B1E1',
      '#F8A5C2', '#F7DC6F', '#82E0AA', '#AED6F1',
      '#FAD7A0', '#D7BDE2', '#A3E4D7', '#F9E79F',
    ];
    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    const TOP_MARGIN = 80;
    const BOTTOM_MARGIN = 140;
    const ROW_HEIGHT = 50;
    const TARGET_MIN = 10;
    const TARGET_MAX = 20;
    const MIN_DURATION = 18;
    const MAX_DURATION = 26;
    const LAUNCH_COOLDOWN = 1800;

    let rowCount;
    let rowFreeAt;

    function recalcRows() {
      const availH = window.innerHeight - TOP_MARGIN - BOTTOM_MARGIN;
      rowCount = Math.max(8, Math.floor(availH / ROW_HEIGHT));
      rowFreeAt = new Array(rowCount).fill(0);
    }
    recalcRows();
    window.addEventListener('resize', recalcRows);

    let danmakuHistory = [];
    let historyCursor = 0;
    let activeCount = 0;
    let lastLaunchTime = 0;
    let maintainTimer = null;

    function findFreeRow() {
      const now = Date.now();
      let best = 0;
      for (let i = 1; i < rowCount; i++) {
        if (rowFreeAt[i] < rowFreeAt[best]) best = i;
      }
      return { row: best, wait: Math.max(0, rowFreeAt[best] - now) };
    }

    function pickRow(urgent) {
      const now = Date.now();
      if (urgent) {
        const freeRows = [];
        for (let i = 0; i < rowCount; i++) {
          if (rowFreeAt[i] <= now) freeRows.push(i);
        }
        if (freeRows.length > 0) {
          return { row: freeRows[Math.floor(Math.random() * freeRows.length)], delay: 0 };
        }
      }
      const found = findFreeRow();
      return { row: found.row, delay: Math.min(found.wait, 3000) };
    }

    function launchOne(text, urgent) {
      const { row, delay } = pickRow(urgent);
      rowFreeAt[row] = Math.max(rowFreeAt[row], Date.now() + LAUNCH_COOLDOWN);

      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'danmaku-item';
        el.textContent = text;
        el.style.color = getRandomColor();
        el.style.top = (TOP_MARGIN + row * ROW_HEIGHT) + 'px';

        const duration = MIN_DURATION + Math.random() * (MAX_DURATION - MIN_DURATION);
        el.style.animationDuration = duration + 's';

        danmakuLayer.appendChild(el);
        activeCount++;
        lastLaunchTime = Date.now();

        const ms = duration * 1000;
        setTimeout(() => {
          el.remove();
          activeCount--;
          scheduleMaintain(200);
        }, ms + 500);
      }, delay);
    }

    function scheduleMaintain(delay) {
      clearTimeout(maintainTimer);
      maintainTimer = setTimeout(maintainScreen, delay);
    }

    function maintainScreen() {
      clearTimeout(maintainTimer);

      if (activeCount >= TARGET_MIN) {
        maintainTimer = setTimeout(maintainScreen, 2000);
        return;
      }

      if (danmakuHistory.length === 0) {
        maintainTimer = setTimeout(maintainScreen, 1500);
        return;
      }

      if (Date.now() - lastLaunchTime < LAUNCH_COOLDOWN) {
        maintainTimer = setTimeout(maintainScreen, LAUNCH_COOLDOWN - (Date.now() - lastLaunchTime));
        return;
      }

      const text = danmakuHistory[historyCursor % danmakuHistory.length];
      historyCursor++;
      launchOne(text);

      maintainTimer = setTimeout(maintainScreen, LAUNCH_COOLDOWN);
    }

    // ==================== Toast ====================
    let toastTimer;
    function showToast(msg, bg = '#FF7B7B') {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.background = bg;
      toast.style.color = '#fff';
      toast.style.display = 'block';
      toast.style.animation = 'none';
      toast.offsetHeight;
      toast.style.animation = 'fadeInOut 2.5s ease forwards';
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ==================== 发送弹幕 ====================
    function sendDanmaku() {
      const text = input.value.trim();
      if (!text) return showToast('请输入弹幕内容', '#FF8E53');
      if (text.length > 100) return showToast('内容不能超过100字', '#FF8E53');
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        return showToast('连接已断开，正在重连...', '#E17055');
      }
      ws.send(JSON.stringify({ type: 'danmaku', text }));
      input.value = '';
      showToast('审核中...', '#45B7D1');
    }
    sendBtn.addEventListener('click', sendDanmaku);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendDanmaku();
    });

    // ==================== WebSocket ====================
    function connectWS() {
      if (ws) {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
      }
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'history') {
          const texts = msg.data.map(d => d.text);
          if (texts.length > 0) {
            danmakuHistory = texts;
            const burst = Math.min(TARGET_MAX, texts.length);
            for (let i = 0; i < burst; i++) {
              setTimeout(() => launchOne(texts[i % texts.length]), i * 600);
            }
            historyCursor = burst;
            scheduleMaintain(burst * 600 + LAUNCH_COOLDOWN);
          }
        } else if (msg.type === 'new_danmaku') {
          danmakuHistory.push(msg.data.text);
          launchOne(msg.data.text, true);
        } else if (msg.type === 'rejected') {
          showToast(msg.message, '#E17055');
        } else if (msg.type === 'error') {
          showToast(msg.message, '#FF8E53');
        }
      };

      ws.onclose = () => {
        showToast('连接断开，3秒后自动重连...', '#E17055');
        clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(connectWS, 3000);
      };

      ws.onerror = () => {
        // onclose will fire after this, triggering reconnect
      };
    }
    connectWS();

    // ==================== 背景音乐 ====================
    let musicOn = true;
    bgm.volume = 0.3;

    function updateMusicUI() {
      if (musicOn) {
        musicIconOn.style.display = 'block';
        musicIconOff.style.display = 'none';
        musicBtn.style.color = 'rgba(255,255,255,0.85)';
        musicBtn.style.background = 'rgba(255,255,255,0.07)';
      } else {
        musicIconOn.style.display = 'none';
        musicIconOff.style.display = 'block';
        musicBtn.style.color = 'rgba(255,255,255,0.40)';
        musicBtn.style.background = 'rgba(255,255,255,0.04)';
      }
    }

    function tryAutoplay() {
      bgm.play().then(() => {
        musicOn = true;
        updateMusicUI();
      }).catch(() => {
        musicOn = false;
        updateMusicUI();
      });
    }
    tryAutoplay();

    document.addEventListener('click', () => {
      if (musicOn && bgm.paused) {
        bgm.play().catch(() => {});
      }
    }, { once: true });

    musicBtn.addEventListener('click', () => {
      if (musicOn) {
        bgm.pause();
        musicOn = false;
      } else {
        bgm.play().then(() => {
          musicOn = true;
        }).catch(() => {});
        musicOn = true;
      }
      updateMusicUI();
    });

    // ==================== 二维码 ====================
    const sendUrl = location.origin + '/send.html';
    const qrImg = document.getElementById('qr-img');
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(sendUrl)}`;
    qrImg.onerror = () => {
      fetch('/api/qrcode')
        .then(r => r.json())
        .then(data => { qrImg.src = data.qrcode; })
        .catch(() => {
          document.getElementById('qr-area').querySelector('p').textContent = '二维码加载失败';
        });
    };
    document.getElementById('send-url-text').textContent = sendUrl;
    document.getElementById('link-hint').style.display = 'block';
  </script>
</body>
</html>
