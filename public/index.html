<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSTART儿童艺术展-11：07PM - 弹幕互动</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== Memphis Design Tokens ========== */
    :root {
      --pink: #FF71CE;
      --yellow: #FFCE5C;
      --teal: #86CCCA;
      --purple: #8B6BAE;
      --coral: #FF6B6B;
      --mint: #7ECB9A;
      --lavender: #B8A9E8;
      --bg-deep: #1a1040;
      --bg-mid: #241a4e;
      --border-width: 3px;
      --shadow-offset: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(150deg, #1a1040 0%, #1e1650 35%, #1a1040 65%, #150d35 100%);
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      position: relative;
    }

    /* ========== 几何图形背景画布 ========== */
    #geofield {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ========== 满月 ========== */
    #moon {
      position: absolute;
      top: 6%;
      left: 10%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 42%, rgba(255,235,180,0.98) 0%, rgba(255,210,120,0.88) 35%, rgba(255,185,80,0.55) 65%, rgba(240,160,50,0.22) 100%);
      box-shadow:
        0 0 50px rgba(255, 215, 100, 0.55),
        0 0 120px rgba(255, 190, 60, 0.35),
        0 0 220px rgba(255, 170, 30, 0.18),
        0 0 380px rgba(255, 170, 30, 0.10),
        0 0 600px rgba(255, 170, 30, 0.05);
      z-index: 1;
      pointer-events: none;
      animation: moonGlow 8s ease-in-out infinite;
    }
    @keyframes moonGlow {
      0%, 100% { box-shadow: 0 0 50px rgba(255, 215, 100, 0.55), 0 0 120px rgba(255, 190, 60, 0.35), 0 0 220px rgba(255, 170, 30, 0.18), 0 0 380px rgba(255, 170, 30, 0.10), 0 0 600px rgba(255, 170, 30, 0.05); }
      50% { box-shadow: 0 0 70px rgba(255, 215, 100, 0.68), 0 0 150px rgba(255, 190, 60, 0.48), 0 0 260px rgba(255, 170, 30, 0.26), 0 0 420px rgba(255, 170, 30, 0.15), 0 0 680px rgba(255, 170, 30, 0.08); }
    }

    /* ========== 弹幕层 ========== */
    #danmaku-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      text-shadow:
        0 0 12px currentColor,
        2px 2px 0 rgba(0,0,0,0.3);
      animation: scroll-left linear forwards;
      pointer-events: none;
      letter-spacing: 0.02em;
    }
    @keyframes scroll-left {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* ========== 标题 ========== */
    #title-area {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    #title-area h1 {
      font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
      font-size: 78px;
      white-space: nowrap;
      letter-spacing: 0.12em;
      color: #FFF8E7;
      text-shadow:
        0 0 30px rgba(255, 215, 100, 0.55),
        0 0 80px rgba(255, 190, 60, 0.35),
        0 0 160px rgba(255, 170, 30, 0.18),
        0 4px 12px rgba(0,0,0,0.45);
      -webkit-text-stroke: 1px rgba(255, 220, 160, 0.25);
      animation: titleFloat 5s ease-in-out infinite;
    }
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* ========== 孟菲斯面板通用 ========== */
    .memphis-panel {
      background: rgba(26, 16, 64, 0.92);
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow:
        var(--shadow-offset) var(--shadow-offset) 0 var(--purple),
        0 0 30px rgba(139,107,174,0.25);
    }

    /* ========== 输入区 ========== */
    #input-area {
      position: absolute;
      top: calc(50% + 58px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
      padding: 10px;
      border-radius: 20px;
      background: rgba(26, 16, 64, 0.92);
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow:
        var(--shadow-offset) var(--shadow-offset) 0 var(--teal),
        0 0 30px rgba(134,204,202,0.2);
    }
    #input-area input {
      width: 340px;
      padding: 12px 22px;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      outline: none;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
      color: #fff;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    #input-area input::placeholder {
      color: rgba(255,255,255,0.35);
      font-weight: 400;
    }
    #input-area input:focus {
      border-color: var(--pink);
      background: rgba(255,255,255,0.16);
      box-shadow: 0 0 0 4px rgba(255,113,206,0.2);
    }
    #input-area button {
      padding: 12px 26px;
      font-size: 18px;
      border: var(--border-width) solid rgba(255,255,255,0.9);
      border-radius: 14px;
      background: var(--pink);
      color: #fff;
      cursor: pointer;
      font-family: 'Fredoka', 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 4px 4px 0 var(--yellow);
    }
    #input-area button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--yellow);
      background: #FF8BD8;
    }
    #input-area button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--yellow);
    }

    /* ========== Toast ========== */
    #toast {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 700;
      z-index: 30;
      display: none;
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
      animation: fadeInOut 2.5s ease forwards;
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ========== 二维码卡片 ========== */
    #qr-area {
      position: absolute;
      bottom: 28px;
      right: 28px;
      border-radius: 20px;
      padding: 20px 20px 14px;
      text-align: center;
      z-index: 20;
      background: rgba(26, 16, 64, 0.92);
      border: var(--border-width) solid rgba(255,255,255,0.85);
      box-shadow:
        calc(-1 * var(--shadow-offset)) var(--shadow-offset) 0 var(--pink),
        0 0 30px rgba(255,113,206,0.2);
    }
    #qr-area img {
      width: 130px;
      height: 130px;
      display: block;
      border-radius: 10px;
      background: #fff;
      padding: 4px;
      border: 2px solid var(--purple);
    }
    #qr-area p {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      font-family: 'Fredoka', 'Nunito', 'PingFang SC', sans-serif;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* ========== 音乐开关 ========== */
    #music-btn {
      position: absolute;
      top: 36px;
      right: 28px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: var(--border-width) solid rgba(255,255,255,0.85);
      background: rgba(26, 16, 64, 0.92);
      cursor: pointer;
      z-index: 20;
      box-shadow: 4px 4px 0 var(--coral);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.9);
    }
    #music-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--coral);
    }
    #music-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--coral);
    }
    #music-btn svg {
      width: 20px;
      height: 20px;
    }

    /* ========== 装饰性几何元素 ========== */
    /* 右上角三角形 */
    .geo-triangle-tr {
      position: absolute;
      top: 3%;
      right: 6%;
      width: 80px;
      height: 80px;
      background: var(--teal);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0.7;
      z-index: 1;
      pointer-events: none;
      animation: geoFloat1 7s ease-in-out infinite;
      border: none;
    }
    /* 左下角菱形 */
    .geo-diamond-bl {
      position: absolute;
      bottom: 15%;
      left: 5%;
      width: 50px;
      height: 50px;
      background: var(--pink);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      opacity: 0.65;
      z-index: 1;
      pointer-events: none;
      animation: geoFloat2 8s ease-in-out infinite;
    }
    /* 中左波浪线 */
    .geo-squiggle-ml {
      position: absolute;
      top: 35%;
      left: 3%;
      width: 120px;
      height: 30px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.5;
      animation: geoFloat3 9s ease-in-out infinite;
    }
    /* 右中小圆点组 */
    .geo-dots-mr {
      position: absolute;
      top: 40%;
      right: 4%;
      width: 60px;
      height: 80px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.55;
      animation: geoFloat1 6s ease-in-out infinite;
    }
    /* 底部中三角形 */
    .geo-triangle-bc {
      position: absolute;
      bottom: 8%;
      left: 50%;
      width: 45px;
      height: 45px;
      background: var(--coral);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0.6;
      z-index: 1;
      pointer-events: none;
      animation: geoFloat2 7.5s ease-in-out infinite;
    }
    @keyframes geoFloat1 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-12px) rotate(5deg); }
      66% { transform: translateY(8px) rotate(-3deg); }
    }
    @keyframes geoFloat2 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }
    @keyframes geoFloat3 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ========== 波点背景图案层 ========== */
    #polka-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* ========== 链接提示 ========== */
    #link-hint {
      position: absolute;
      bottom: 28px;
      left: 28px;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      z-index: 20;
      font-family: 'Nunito', 'Fredoka', 'PingFang SC', sans-serif;
      font-weight: 600;
      pointer-events: none;
    }

    /* ========== 浮动儿童画廊 ========== */
    #gallery-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .art-frame {
      position: absolute;
      opacity: 0.75;
      will-change: transform;
    }

    .art-frame img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.45));
    }

  </style>
</head>
<body>

  <!-- 波点背景 -->
  <div id="polka-bg"></div>

  <!-- 浮动儿童画廊 -->
  <div id="gallery-layer"></div>

  <!-- 几何图形背景 -->
  <canvas id="geofield"></canvas>

  <!-- 孟菲斯太阳 -->
  <div id="moon"></div>

  <!-- 装饰几何元素 -->
  <div class="geo-triangle-tr"></div>
  <div class="geo-diamond-bl"></div>
  <svg class="geo-squiggle-ml" viewBox="0 0 120 30" fill="none">
    <path d="M0,15 Q15,2 30,15 Q45,28 60,15 Q75,2 90,15 Q105,28 120,15"
          stroke="#FFCE5C" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <svg class="geo-dots-mr" viewBox="0 0 60 80">
    <circle cx="15" cy="12" r="5" fill="#FF71CE"/>
    <circle cx="35" cy="12" r="5" fill="#FF71CE"/>
    <circle cx="15" cy="32" r="5" fill="#86CCCA"/>
    <circle cx="35" cy="32" r="5" fill="#86CCCA"/>
    <circle cx="15" cy="52" r="5" fill="#FFCE5C"/>
    <circle cx="35" cy="52" r="5" fill="#FFCE5C"/>
    <circle cx="25" cy="72" r="5" fill="#FF6B6B"/>
  </svg>
  <div class="geo-triangle-bc"></div>

  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="auto"
         src="children-light-music.mp3">
  </audio>

  <!-- 弹幕层 -->
  <div id="danmaku-layer"></div>

  <!-- 标题 -->
  <div id="title-area">
    <h1>儿童艺术展-11：07pm</h1>
  </div>

  <!-- 输入框 -->
  <div id="input-area">
    <input id="danmaku-input" type="text" maxlength="100"
           placeholder="输入弹幕，一起互动吧~" autofocus>
    <button id="send-btn">发送</button>
  </div>

  <!-- 提示 -->
  <div id="toast"></div>

  <!-- 二维码 -->
  <div id="qr-area">
    <img id="qr-img" src="" alt="扫码发送弹幕">
    <p>扫码发送弹幕</p>
  </div>

  <!-- 音乐开关 -->
  <button id="music-btn" title="音乐开关">
    <svg id="music-icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="music-icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- 链接 -->
  <div id="link-hint" style="display:none;">
    手机发送：<span id="send-url-text"></span>
  </div>

  <script>
    // ==================== 孟菲斯几何背景 ====================
    const geofield = document.getElementById('geofield');
    const geoCtx = geofield.getContext('2d');
    let geoShapes = [];
    const SHAPE_COUNT = 100;

    const memphisColors = [
      '#FF71CE', '#FFCE5C', '#86CCCA', '#8B6BAE',
      '#FF6B6B', '#7ECB9A', '#B8A9E8', '#FFB347',
    ];

    function resizeGeofield() {
      geofield.width = window.innerWidth;
      geofield.height = window.innerHeight;
    }

    function drawTriangle(ctx, cx, cy, size, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(-size * 0.866, size * 0.5);
      ctx.lineTo(size * 0.866, size * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawDiamond(ctx, cx, cy, size, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.7, 0);
      ctx.lineTo(0, size);
      ctx.lineTo(-size * 0.7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawCross(ctx, cx, cy, size, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      const w = size * 0.35;
      ctx.fillRect(-size * 0.7, -w, size * 1.4, w * 2);
      ctx.fillRect(-w, -size * 0.7, w * 2, size * 1.4);
      ctx.restore();
    }

    function drawRing(ctx, cx, cy, size) {
      ctx.beginPath();
      ctx.arc(cx, cy, size, 0, Math.PI * 2);
      ctx.stroke();
    }

    function createGeoShapes() {
      geoShapes = [];
      for (let i = 0; i < SHAPE_COUNT; i++) {
        const type = Math.floor(Math.random() * 5); // 0:circle, 1:triangle, 2:diamond, 3:cross, 4:ring
        geoShapes.push({
          type,
          x: Math.random() * geofield.width,
          y: Math.random() * geofield.height,
          size: Math.random() * 10 + 3,
          color: memphisColors[Math.floor(Math.random() * memphisColors.length)],
          baseAlpha: Math.random() * 0.22 + 0.08,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.004,
          floatSpeed: Math.random() * 0.015 + 0.003,
          floatPhase: Math.random() * Math.PI * 2,
        });
      }
    }

    function drawGeoShapes() {
      geoCtx.clearRect(0, 0, geofield.width, geofield.height);
      const t = Date.now() / 1000;

      for (const s of geoShapes) {
        const yOffset = Math.sin(t * s.floatSpeed * 8 + s.floatPhase) * 8;
        const alpha = s.baseAlpha + Math.sin(t * 0.7 + s.floatPhase) * 0.05;
        geoCtx.globalAlpha = Math.max(0.04, Math.min(0.35, alpha));
        geoCtx.fillStyle = s.color;
        geoCtx.strokeStyle = s.color;
        geoCtx.lineWidth = 1.5;

        const rot = s.rotation + t * s.rotSpeed;
        const dy = s.y + yOffset;

        switch (s.type) {
          case 0: // circle
            geoCtx.beginPath();
            geoCtx.arc(s.x, dy, s.size, 0, Math.PI * 2);
            geoCtx.fill();
            break;
          case 1: // triangle
            drawTriangle(geoCtx, s.x, dy, s.size, rot);
            break;
          case 2: // diamond
            drawDiamond(geoCtx, s.x, dy, s.size, rot);
            break;
          case 3: // cross
            drawCross(geoCtx, s.x, dy, s.size, rot);
            break;
          case 4: // ring
            drawRing(geoCtx, s.x, dy, s.size);
            break;
        }
      }
      geoCtx.globalAlpha = 1;
      requestAnimationFrame(drawGeoShapes);
    }

    resizeGeofield();
    createGeoShapes();
    drawGeoShapes();
    window.addEventListener('resize', () => {
      resizeGeofield();
      createGeoShapes();
    });

    // ==================== WebSocket ====================
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    let wsReconnectTimer = null;

    const danmakuLayer = document.getElementById('danmaku-layer');
    const input = document.getElementById('danmaku-input');
    const sendBtn = document.getElementById('send-btn');
    const toast = document.getElementById('toast');
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    const musicIconOn = document.getElementById('music-icon-on');
    const musicIconOff = document.getElementById('music-icon-off');

    // ==================== 弹幕系统 ====================
    const colors = [
      '#FF71CE', '#FFCE5C', '#86CCCA', '#8B6BAE',
      '#FF6B6B', '#7ECB9A', '#B8A9E8', '#FFB347',
      '#FF8E72', '#4ECDC4', '#FF69B4', '#87CEEB',
      '#F7DC6F', '#82E0AA', '#F8A5C2', '#AED6F1',
    ];
    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    const TOP_MARGIN = 80;
    const BOTTOM_MARGIN = 140;
    const ROW_HEIGHT = 50;
    const TARGET_MIN = 10;
    const TARGET_MAX = 20;
    const MIN_DURATION = 18;
    const MAX_DURATION = 26;
    const LAUNCH_COOLDOWN = 1800;

    let rowCount;
    let rowFreeAt;

    function recalcRows() {
      const availH = window.innerHeight - TOP_MARGIN - BOTTOM_MARGIN;
      rowCount = Math.max(8, Math.floor(availH / ROW_HEIGHT));
      rowFreeAt = new Array(rowCount).fill(0);
    }
    recalcRows();
    window.addEventListener('resize', recalcRows);

    let danmakuHistory = [];
    let historyCursor = 0;
    let activeCount = 0;
    let lastLaunchTime = 0;
    let maintainTimer = null;

    function findFreeRow() {
      const now = Date.now();
      let best = 0;
      for (let i = 1; i < rowCount; i++) {
        if (rowFreeAt[i] < rowFreeAt[best]) best = i;
      }
      return { row: best, wait: Math.max(0, rowFreeAt[best] - now) };
    }

    function pickRow(urgent) {
      const now = Date.now();
      if (urgent) {
        const freeRows = [];
        for (let i = 0; i < rowCount; i++) {
          if (rowFreeAt[i] <= now) freeRows.push(i);
        }
        if (freeRows.length > 0) {
          return { row: freeRows[Math.floor(Math.random() * freeRows.length)], delay: 0 };
        }
      }
      const found = findFreeRow();
      return { row: found.row, delay: Math.min(found.wait, 3000) };
    }

    function launchOne(text, urgent) {
      const { row, delay } = pickRow(urgent);
      rowFreeAt[row] = Math.max(rowFreeAt[row], Date.now() + LAUNCH_COOLDOWN);

      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'danmaku-item';
        el.textContent = text;
        el.style.color = getRandomColor();
        el.style.top = (TOP_MARGIN + row * ROW_HEIGHT) + 'px';

        const duration = MIN_DURATION + Math.random() * (MAX_DURATION - MIN_DURATION);
        el.style.animationDuration = duration + 's';

        danmakuLayer.appendChild(el);
        activeCount++;
        lastLaunchTime = Date.now();

        const ms = duration * 1000;
        setTimeout(() => {
          el.remove();
          activeCount--;
          scheduleMaintain(200);
        }, ms + 500);
      }, delay);
    }

    function scheduleMaintain(delay) {
      clearTimeout(maintainTimer);
      maintainTimer = setTimeout(maintainScreen, delay);
    }

    function maintainScreen() {
      clearTimeout(maintainTimer);

      if (activeCount >= TARGET_MIN) {
        maintainTimer = setTimeout(maintainScreen, 2000);
        return;
      }

      if (danmakuHistory.length === 0) {
        maintainTimer = setTimeout(maintainScreen, 1500);
        return;
      }

      if (Date.now() - lastLaunchTime < LAUNCH_COOLDOWN) {
        maintainTimer = setTimeout(maintainScreen, LAUNCH_COOLDOWN - (Date.now() - lastLaunchTime));
        return;
      }

      const text = danmakuHistory[historyCursor % danmakuHistory.length];
      historyCursor++;
      launchOne(text);

      maintainTimer = setTimeout(maintainScreen, LAUNCH_COOLDOWN);
    }

    // ==================== Toast ====================
    let toastTimer;
    function showToast(msg, bg = '#FF6B6B') {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.background = bg;
      toast.style.color = '#fff';
      toast.style.display = 'block';
      toast.style.animation = 'none';
      toast.offsetHeight;
      toast.style.animation = 'fadeInOut 2.5s ease forwards';
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    // ==================== 发送弹幕 ====================
    function sendDanmaku() {
      const text = input.value.trim();
      if (!text) return showToast('请输入弹幕内容', '#FF8E53');
      if (text.length > 100) return showToast('内容不能超过100字', '#FF8E53');
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        return showToast('连接已断开，正在重连...', '#E17055');
      }
      ws.send(JSON.stringify({ type: 'danmaku', text }));
      input.value = '';
      showToast('审核中...', '#45B7D1');
    }
    sendBtn.addEventListener('click', sendDanmaku);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendDanmaku();
    });

    // ==================== WebSocket ====================
    function connectWS() {
      if (ws) {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onclose = null;
        ws.onerror = null;
      }
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'history') {
          const texts = msg.data.map(d => d.text);
          if (texts.length > 0) {
            danmakuHistory = texts;
            const burst = Math.min(TARGET_MAX, texts.length);
            for (let i = 0; i < burst; i++) {
              setTimeout(() => launchOne(texts[i % texts.length]), i * 600);
            }
            historyCursor = burst;
            scheduleMaintain(burst * 600 + LAUNCH_COOLDOWN);
          }
        } else if (msg.type === 'new_danmaku') {
          danmakuHistory.push(msg.data.text);
          launchOne(msg.data.text, true);
        } else if (msg.type === 'rejected') {
          showToast(msg.message, '#E17055');
        } else if (msg.type === 'error') {
          showToast(msg.message, '#FF8E53');
        }
      };

      ws.onclose = () => {
        showToast('连接断开，3秒后自动重连...', '#E17055');
        clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(connectWS, 3000);
      };

      ws.onerror = () => {
        // onclose will fire after this, triggering reconnect
      };
    }
    connectWS();

    // ==================== 背景音乐 ====================
    let musicOn = true;
    bgm.volume = 0.3;

    function updateMusicUI() {
      if (musicOn) {
        musicIconOn.style.display = 'block';
        musicIconOff.style.display = 'none';
        musicBtn.style.color = 'rgba(255,255,255,0.9)';
        musicBtn.style.background = 'rgba(26, 16, 64, 0.92)';
      } else {
        musicIconOn.style.display = 'none';
        musicIconOff.style.display = 'block';
        musicBtn.style.color = 'rgba(255,255,255,0.4)';
        musicBtn.style.background = 'rgba(26, 16, 64, 0.6)';
      }
    }

    function tryAutoplay() {
      bgm.play().then(() => {
        musicOn = true;
        updateMusicUI();
      }).catch(() => {
        musicOn = false;
        updateMusicUI();
      });
    }
    tryAutoplay();

    document.addEventListener('click', () => {
      if (musicOn && bgm.paused) {
        bgm.play().catch(() => {});
      }
    }, { once: true });

    musicBtn.addEventListener('click', () => {
      if (musicOn) {
        bgm.pause();
        musicOn = false;
      } else {
        bgm.play().then(() => {
          musicOn = true;
        }).catch(() => {});
        musicOn = true;
      }
      updateMusicUI();
    });

    // ==================== 浮动儿童画廊（物理碰撞版）====================
    function initFloatingGallery() {
      const layer = document.getElementById('gallery-layer');
      const arts = [
        { src: 'assets/变色龙.png', color: 'var(--pink)',     size: 150 },
        { src: 'assets/大树.png',   color: 'var(--teal)',     size: 145 },
        { src: 'assets/鸟巢.png',   color: 'var(--coral)',    size: 145 },
        { src: 'assets/风.png',     color: 'var(--yellow)',   size: 135 },
        { src: 'assets/乌隼.png',   color: 'var(--mint)',     size: 150 },
        { src: 'assets/月亮.png',   color: 'var(--lavender)', size: 140 },
        { src: 'assets/空气.png',   color: 'var(--purple)',   size: 155 },
      ];

      let W = window.innerWidth;
      let H = window.innerHeight;
      const items = [];

      function rand(min, max) { return min + Math.random() * (max - min); }

      function findSafePos(width, height, existing) {
        for (let attempt = 0; attempt < 200; attempt++) {
          const x = rand(20, W - width - 20);
          const y = rand(20, H - height - 20);
          let ok = true;
          for (const o of existing) {
            if (x < o.x + o.w && x + width > o.x &&
                y < o.y + o.h && y + height > o.y) {
              ok = false; break;
            }
          }
          if (ok) return { x, y };
        }
        return { x: rand(20, W - width - 20), y: rand(20, H - height - 20) };
      }

      arts.forEach((art, i) => {
        const frame = document.createElement('div');
        frame.className = 'art-frame';
        frame.style.width = art.size + 'px';
        frame.style.willChange = 'transform';

        const rot = [2, -3, 4, -2, 3, -4, 1][i];

        const img = document.createElement('img');
        img.src = art.src;
        img.alt = '';
        img.loading = 'lazy';
        if (art.src.includes('大树')) img.style.mixBlendMode = 'multiply';
        else if (art.src.includes('鸟巢')) img.style.mixBlendMode = 'screen';
        frame.appendChild(img);
        layer.appendChild(frame);

        const item = {
          el: frame,
          w: art.size,
          h: art.size,
          x: 0, y: 0,
          vx: rand(0.25, 0.55) * (Math.random() < 0.5 ? 1 : -1),
          vy: rand(0.2, 0.45) * (Math.random() < 0.5 ? 1 : -1),
          rot: rot,
          floatPhase: rand(0, Math.PI * 2),
        };

        img.onload = () => {
          const ratio = img.naturalHeight / img.naturalWidth;
          item.h = art.size * ratio;
          const pos = findSafePos(item.w, item.h, items);
          item.x = pos.x;
          item.y = pos.y;
        };

        // 图片未加载前先用正方形估算
        const pos = findSafePos(item.w, item.h, items);
        item.x = pos.x;
        item.y = pos.y;
        items.push(item);
      });

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function resolveCollision(a, b) {
        const overlapX = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
        const overlapY = Math.min(a.y + a.h - b.y, b.y + b.h - a.y);

        if (overlapX < overlapY) {
          // 水平碰撞
          const push = overlapX * 0.52;
          if (a.x < b.x) { a.x -= push; b.x += push; }
          else           { a.x += push; b.x -= push; }
          a.vx = -a.vx;
          b.vx = -b.vx;
        } else {
          // 垂直碰撞
          const push = overlapY * 0.52;
          if (a.y < b.y) { a.y -= push; b.y += push; }
          else           { a.y += push; b.y -= push; }
          a.vy = -a.vy;
          b.vy = -b.vy;
        }
      }

      let lastT = performance.now();
      function tick(now) {
        const dt = Math.min((now - lastT) / 16.67, 3); // 以60fps为基准，限制最大步长
        lastT = now;

        W = window.innerWidth;
        H = window.innerHeight;

        for (const item of items) {
          // 正弦浮动叠加在 y 上
          const floatY = Math.sin(now * 0.0008 + item.floatPhase) * 0.35 * dt;

          item.x += item.vx * dt;
          item.y += (item.vy + floatY) * dt;

          // 边界反弹（留一点边距）
          if (item.x < 10) { item.x = 10; item.vx = Math.abs(item.vx); }
          if (item.x + item.w > W - 10) { item.x = W - 10 - item.w; item.vx = -Math.abs(item.vx); }
          if (item.y < 10) { item.y = 10; item.vy = Math.abs(item.vy); }
          if (item.y + item.h > H - 10) { item.y = H - 10 - item.h; item.vy = -Math.abs(item.vy); }
        }

        // 碰撞检测与响应
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            if (rectsOverlap(items[i], items[j])) {
              resolveCollision(items[i], items[j]);
            }
          }
        }

        // 应用 transform
        for (const item of items) {
          item.el.style.transform = `translate3d(${item.x.toFixed(1)}px, ${item.y.toFixed(1)}px, 0) rotate(${item.rot}deg)`;
        }

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
    initFloatingGallery();

    // ==================== 二维码 ====================
    const sendUrl = location.origin + '/send.html';
    const qrImg = document.getElementById('qr-img');
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(sendUrl)}`;
    qrImg.onerror = () => {
      fetch('/api/qrcode')
        .then(r => r.json())
        .then(data => { qrImg.src = data.qrcode; })
        .catch(() => {
          document.getElementById('qr-area').querySelector('p').textContent = '二维码加载失败';
        });
    };
    document.getElementById('send-url-text').textContent = sendUrl;
    document.getElementById('link-hint').style.display = 'block';
  </script>
</body>
